services:
  database:
    image: mariadb:11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: ./api
    depends_on:
      - database
    environment:
      DATABASE_URL: "mysql://app:app@database:3306/app"
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app

  client:
    build: ./client
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"

volumes:
  db_data:
